# FALLBACK: runs the whole pipeline inside this GitHub Actions job instead of on Render.
# Manual dispatch only. Switch to it only if the Render spike (tasks.md 16.4) shows a free instance cannot
# finish the run. To switch, see docs/deployment.md "Switching to the fallback": add the `schedule`
# block below and remove the schedule from daily-job-run.yml.
# Unlike the trigger workflows, this one needs the pipeline secrets as repository secrets.
name: Pipeline in Actions (fallback)

on:
  workflow_dispatch:
    inputs:
      only_methods:
        description: "Optional: comma-separated fetch methods to run (e.g. open_api,ats_board)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (write nothing)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "17 15 * * *"

concurrency:
  group: daily-job-run       # shares the group with the trigger workflow, so the two never overlap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install .
      - name: Run the pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_TOKENS: ${{ secrets.APIFY_TOKENS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          ONLY_METHODS: ${{ inputs.only_methods }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args="--trigger-id github-fallback"
          if [ -n "$ONLY_METHODS" ]; then args="$args --only-methods $ONLY_METHODS"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          job-aggregator $args
