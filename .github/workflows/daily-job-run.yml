# Wakes the Render service and starts the daily run, then waits for it to finish.
# This job only calls the service: it holds no pipeline secrets, only the trigger URL and one trigger secret.
# A failure (service unreachable, run failed or interrupted, or still running at the limit) fails this
# workflow, so GitHub emails the owner.
name: Daily job run (trigger)

on:
  schedule:
    - cron: "17 15 * * *"   # 15:17 UTC = 20:47 IST; an off-peak minute to avoid top-of-hour delays
  workflow_dispatch: {}

concurrency:
  group: daily-job-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # above trigger.poll_limit_minutes (45) plus the wake-up wait
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install trigger dependency
        run: pip install PyYAML==6.0.2
      - name: Start the run and wait for it
        env:
          TRIGGER_URL: ${{ secrets.TRIGGER_URL }}
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: python scripts/trigger_and_wait.py run
