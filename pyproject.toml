[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-aggregator"
version = "0.1.0"
description = "Daily job aggregation pipeline: fetch, parse, normalise, dedupe, score, persist and notify."
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
    "pydantic==2.14.3",
    "httpx==0.28.1",
    "supabase==2.34.1",
    "python-jobspy==1.1.80",
    "apify-client==1.8.1",
    "apify-shared==1.2.1",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[project.scripts]
job-aggregator = "job_aggregator.orchestration.run_daily:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
